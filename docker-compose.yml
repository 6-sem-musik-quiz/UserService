# Runs the API against the REAL Postgres in the cluster (over Tailscale).
# This is live data: what you create or delete here is real.
#
# One-time setup (see README, "Running locally"):
#   copy .env.example to .env   (.env is in .gitignore, never commit it)
#   put the userservice DB password in .env
#
#   docker compose up --build
#
# Compose stops with an error if DB_PASSWORD is missing or empty.
services:
  api:
    build: .
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=${DB_HOST:-quiz-postgres.tail5a1bc5.ts.net};Port=${DB_PORT:-5432};Database=userservice;Username=userservice;Password=${DB_PASSWORD:?DB_PASSWORD is not set. Copy .env.example to .env and fill it in (see README)}"
      # Never run migrations against the shared database from a local branch.
      # Schema changes reach the real database only through a deploy from main.
      Database__MigrateOnStartup: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
